name: refresh

on:
  schedule:
    - cron: "17 6 * * *"        # daily, 06:17 UTC: off the hour, when queued schedules are delayed or dropped
  workflow_dispatch:
    inputs:
      full:
        description: "re-trace every closed issue and re-read every star count"
        type: boolean
        default: false

permissions:
  contents: write               # the only permission the job needs: it commits generated files

concurrency:
  group: refresh
  cancel-in-progress: false     # a manual run during the daily one queues instead of racing it

jobs:
  refresh:
    runs-on: ubuntu-24.04       # pinned, so a move of the ubuntu-latest label is a decision, not a surprise
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require the exclusion
        env:
          PROFILE_EXCLUDE: ${{ secrets.PROFILE_EXCLUDE }}
        run: '[ -n "$PROFILE_EXCLUDE" ] || { echo "PROFILE_EXCLUDE is not set"; exit 1; }'
      - name: Fetch
        env:                                          # environment only; build.py prints neither
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_EXCLUDE: ${{ secrets.PROFILE_EXCLUDE }}
          PROFILE_FULL: ${{ inputs.full && '1' || '' }}
        run: python3 build.py fetch
      - name: Render
        run: python3 build.py
      - name: Commit if changed
        # fetch.json "checked" moves at least every 30 days (build.py HEARTBEAT_DAYS), so even a quiet
        # month makes one commit and GitHub never disables this schedule for 60 days without activity
        run: |
          git add README.md CHECKS.md assets data
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refresh data"
          git pull --rebase
          git push
