<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 630" width="830" height="630" role="img" aria-labelledby="t d">
<title id="t">things i made</title>
<desc id="d">10 small python tools as cards on a shelf, each with an icon, under three headings. tests and repos: tolwatch, pytest plugin: flags allclose, isclose and approx checks that can&#x27;t fail, or are far looser than they need to be; ziptrace, names the zip() and map() calls that silently dropped data to a length mismatch; unadded, finds the untracked or gitignored files a passing test run quietly depends on, before CI does; whymodified, git status says modified and nothing changed: says why, and the one command that clears it. science data: shotfloor, the score a flawless quantum computer gets at a given shot count, and the shots it needs to reach a target; trigalign, pairs a stimulus log with an EEG trigger list when triggers dropped, doubled, or the clocks drifted. grading code: scoreprobe, feeds a grader the inputs known to slip through (a blank answer, &quot;not Paris&quot; against &quot;Paris&quot;, 4200 against 42) and reports which earned credit; normladder, is &quot;1,000&quot; the same answer as &quot;1000&quot;? 8 of 14 answer-matching rules from lm-eval, HELM and SQuAD say yes; it shows which, and why; mcqlint, lints multiple-choice eval sets: keys that name no option, duplicate options, leaked answers, position bias; tabverify, recomputes the averages, deltas and bold in results tables at the printed precision, and flags what no rounding explains.</desc>
<style>text{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;font-size:12px;fill:#1f2328}.m{fill:#59636e}.a{fill:#0969da}.b{font-size:26px}.e{text-anchor:end}.c{text-anchor:middle}.w{fill:#bc4c00}.nm{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;font-weight:700}.s13{font-size:13px}.s14{font-size:14px}.s16{font-size:16px}.s22{font-size:22px}.s30{font-size:30px}.s40{font-size:40px}.s52{font-size:52px}.cd{animation:rise .5s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(6px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
