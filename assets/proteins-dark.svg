<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 342" width="380" height="342" role="img" aria-labelledby="t d">
<title id="t">proteins: a backbone drawn out of a blur (schematic)</title>
<desc id="d">Schematic, not data: a 41-residue protein backbone from textbook geometry (a helix of 18 residues at 3.6 residues/turn and 1.5 Å rise, a loop, and a two-strand hairpin at 3.3 Å strand step) drawn out of a blurred pretend density map, with a 10 Å scale bar. It stands for DeepTracer&#x27;s job in UW&#x27;s DAIS lab: cryo-EM map in, 3D backbone out.</desc>
